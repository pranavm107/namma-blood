$kind: http-request
description: "Negative Test: Verify 401 Unauthorized is returned when submitting incorrect password credentials."
url: "{{baseUrl}}/api/user/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "synthetic_user@example.com",
      "password": "WrongPassword!999"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 401 Unauthorized", function () {
          pm.response.to.have.status(401);
      });

      pm.test("Returns authentication failure message", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property("message");
          pm.expect(jsonData.message).to.include("Email or Password incorrect");
      });
    language: text/javascript
order: 5000
