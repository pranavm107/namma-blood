$kind: http-request
name: 1.6 POST Login - Validation Failure (Missing Password) [400 Bad Request]
description: "Negative Test: Verify 400 Bad Request is triggered by `loginMiddleware` when required login fields are missing."
url: "{{baseUrl}}/api/user/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "synthetic_user@example.com"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400 Bad Request", function () {
          pm.response.to.have.status(400);
      });

      pm.test("Returns missing value validation error", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property("message");
          pm.expect(jsonData.message).to.include("Required missing values");
      });
    language: text/javascript
order: 6000
